version: "3.9"

services:
  # ==============================
  # Qdrant Vector Database
  # ==============================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatnshop-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    restart: unless-stopped
    healthcheck:
      # Use bash TCP check since curl is not available in Qdrant container
      # Checks if port 6333 is open and Qdrant is accepting connections
      # Note: This checks connectivity, not API functionality (API key still required for API calls)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333 && exec 3<&- || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ==============================
  # Redis Cache
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: chatns-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ==============================
  # FastAPI Intent Classifier API
  # ==============================
  intent-api:
    build: .
    container_name: chatnshop-intent-api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.3}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-400}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================
  # Prometheus (Metrics Collector)
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: chatnshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./app/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    depends_on:
      - intent-api

  # ==============================
  # Grafana (Metrics Dashboard)
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: chatnshop-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

# ==============================
# Persistent Storage
# ==============================
volumes:
  qdrant_storage:
  redis_data:
